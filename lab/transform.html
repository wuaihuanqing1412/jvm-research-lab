<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JVM from scratch - transform</title>
    <style>
      body { margin: 0; background: #08070c; color: #e8dcc2; font: 14px/1.7 ui-monospace, monospace; }
      main { max-width: 920px; margin: 56px auto; padding: 0 20px; }
      h1 { font-size: 24px; color: #d9ab5e; margin-bottom: 4px; }
      .sub { color: #8d8170; margin-bottom: 24px; }
      .meta { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; color: #b9a98c; font-size: 12px; }
      .meta b { color: #d9ab5e; font-weight: 500; }
      #trace { color: #7d7364; font-size: 11.5px; margin-bottom: 12px; white-space: pre-wrap; max-height: 180px; overflow: auto; }
      pre { background: #05040a; border: 1px solid #2a241a; padding: 16px; min-height: 180px; white-space: pre-wrap; margin: 0; }
      .err { color: #e06b6b; }
    </style>
  </head>
  <body>
    <main>
      <h1>JVM from scratch - transform</h1>
      <div class="sub">ASM ClassReader -&gt; rewrite method body -&gt; defineClass</div>
      <div class="meta" id="meta"></div>
      <div id="trace"></div>
      <pre id="out">loading...</pre>
    </main>
    <script type="module">
      import { parseClass } from './jvm.js'
      import { createVM2 } from './vm2.js'

      const out = document.getElementById('out')
      const meta = document.getElementById('meta')
      const trace = document.getElementById('trace')
      const log = (s) => {
        trace.textContent += s + '\n'
        trace.scrollTop = trace.scrollHeight
      }

      const classes = new Map()
      async function load(name) {
        if (classes.has(name)) return classes.get(name)
        const urls = ['./' + name + '.class', './asm/' + name + '.class', './jdk/classes/' + name + '.class']
        for (const url of urls) {
          const res = await fetch(url)
          if (res.ok) {
            const cls = parseClass(await res.arrayBuffer())
            classes.set(name, cls)
            return cls
          }
        }
        throw new Error('cannot load ' + name)
      }

      let vm = null
      ;(async () => {
        try {
          await load('TransformTest')
          const dyn = new Uint8Array(await fetch('./resources/dynamic.bin').then((r) => r.arrayBuffer()))
          let lines = null
          for (let attempt = 0; attempt < 200; attempt++) {
            vm = createVM2([...classes.values()], { 'dynamic.bin': dyn })
            try {
              lines = vm.runMain('TransformTest')
              break
            } catch (e) {
              if (e && e.missingClass) {
                log('load ' + e.missingClass)
                await load(e.missingClass)
                continue
              }
              throw e
            }
          }
          meta.innerHTML = '<span>classes <b>' + classes.size + '</b></span><span>transform <b>on</b></span>'
          out.textContent = lines ? lines.join('\n') : 'no output'
        } catch (e) {
          out.innerHTML = '<span class="err">' + (vm ? vm.out.join('\n') + '\n\n' : '') + String(e && e.stack ? e.stack : e) + '</span>'
        }
      })()
    </script>
  </body>
</html>
