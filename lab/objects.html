<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JVM from scratch · objects</title>
    <style>
      body { margin: 0; background: #08070c; color: #e8dcc2; font: 14px/1.7 ui-monospace, monospace; }
      main { max-width: 900px; margin: 56px auto; padding: 0 20px; }
      h1 { font-size: 24px; color: #d9ab5e; margin-bottom: 4px; }
      .sub { color: #8d8170; margin-bottom: 24px; }
      .meta { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; color: #b9a98c; font-size: 12px; }
      .meta b { color: #d9ab5e; font-weight: 500; }
      pre { background: #05040a; border: 1px solid #2a241a; padding: 16px; min-height: 220px; white-space: pre-wrap; margin: 0; }
      .err { color: #e06b6b; }
    </style>
  </head>
  <body>
    <main>
      <h1>JVM from scratch · objects</h1>
      <div class="sub">对象 / 字段 / 数组 / StringBuilder，仍然零 JVM 依赖</div>
      <div class="meta" id="meta"></div>
      <pre id="out">loading...</pre>
    </main>
    <script type="module">
      import { parseClass } from './jvm.js'
      import { createVM2 } from './vm2.js'

      const out = document.getElementById('out')
      const meta = document.getElementById('meta')
      ;(async () => {
        try {
          const load = async (name) =>
            parseClass(await fetch('./' + name).then((r) => r.arrayBuffer()))
          const main = await load('Demo2.class')
          const point = await load('Demo2%24Point.class')
          const vm = createVM2([main, point])
          const lines = vm.runMain('Demo2')
          meta.innerHTML =
            '<span>classes <b>' + vm.classes.size + '</b></span>' +
            '<span>major <b>' + main.major + '</b> (Java ' + (main.major - 44) + ')</span>' +
            '<span>lines <b>' + lines.length + '</b></span>'
          out.textContent = lines.join('\n')
        } catch (e) {
          out.innerHTML = '<span class="err">' + String(e && e.stack ? e.stack : e) + '</span>'
        }
      })()
    </script>
  </body>
</html>
