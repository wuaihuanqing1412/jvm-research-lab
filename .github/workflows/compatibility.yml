name: compatibility

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mixin-harness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup dependencies and JDK classes
        shell: powershell
        run: |
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup.ps1 -JdkHome $env:JAVA_HOME
            if ($LASTEXITCODE -ne 0) { throw "setup.ps1 exited with $LASTEXITCODE" }
          } catch {
            Write-Host "::error::$($_.Exception.Message)"
            exit 1
          }

      - name: Build Java harness
        shell: powershell
        run: |
          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1 -JdkHome $env:JAVA_HOME
            if ($LASTEXITCODE -ne 0) { throw "build.ps1 exited with $LASTEXITCODE" }
          } catch {
            Write-Host "::error::$($_.Exception.Message)"
            exit 1
          }

      - name: Run Mixin acceptance
        shell: powershell
        run: |
          $out = node lab/run-realmixin.mjs
          $out | Write-Host
          if (-not ($out -match "real mixin HEAD")) { throw "missing HEAD callback" }
          if (-not ($out -match "real mixin RETURN")) { throw "missing RETURN callback" }
          if (-not ($out -match "42")) { throw "missing original return value" }
